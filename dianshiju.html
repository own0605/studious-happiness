<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电视剧频道</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            padding-top: 300px;
            min-height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            padding: 40px 20px 20px;
            z-index: 999;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            font-size: 42px;
            margin-bottom: 20px;
            color: #ff6b9d;
            font-family: "幼圆", sans-serif;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .search-input {
            width: 60%;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.15);
            color: #fff;
            backdrop-filter: blur(10px);
        }

            .search-input::placeholder {
                color: #ccc;
            }

        .search-btn {
            padding: 12px 25px;
            margin-left: 10px;
            border-radius: 30px;
            border: none;
            background: #ff6b9d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-item {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

            .nav-item:hover {
                background: #ff6b9d;
                transform: scale(1.08);
                box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
            }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            .anime-card:hover {
                transform: translateY(-8px) scale(1.03);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
                border-color: rgba(255, 255, 255, 0.3);
            }

            .anime-card img {
                width: 100%;
                height: 280px;
                object-fit: cover;
            }

        .anime-name {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- 统一版导航栏 -->
    <div class="header">
        <div class="container">
            <h1 class="title">张雨筝的电视剧频道</h1>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索全站内容" oninput="searchTV()">
                <button class="search-btn" onclick="searchTV()">搜索</button>
            </div>
            <div class="nav-tabs">
                <div class="nav-item" onclick="location.href='index.html'">首页</div>
                <div class="nav-item" onclick="location.href='dongman.html'">动漫</div>
                <div class="nav-item" onclick="location.href='dianshiju.html'">电视剧</div>
                <div class="nav-item" onclick="location.href='dianying.html'">电影</div>
                <div class="nav-item" onclick="location.href='zongyi.html'">综艺</div>
            </div>
        </div>
    </div>

    <!-- 内容区域 -->
    <div class="container">
        <div class="anime-grid">
            <div class="anime-card" onclick="location.href='episode.html?name=狂飙&total=40'">
                <img src="https://ts1.tc.mm.bing.net/th/id/OIP-C.BiN82RePSQFQAgBX_N0TEQHaM2?w=193&h=329&c=8&rs=1&qlt=90&o=6&dpr=1.5&pid=3.1&rm=2" alt="封面">
                <div class="anime-name">狂飙</div>
            </div>
            <div class="anime-card" onclick="location.href='episode.html?name=漫长的季节&total=12'">
                <img src="https://picsum.photos/300/400?random=22" alt="封面">
                <div class="anime-name">漫长的季节</div>
            </div>
            <div class="anime-card" onclick="location.href='episode.html?name=三体&total=30'">
                <img src="https://picsum.photos/300/400?random=23" alt="封面">
                <div class="anime-name">三体</div>
            </div>
            <div class="anime-card" onclick="location.href='episode.html?name=苍兰诀&total=36'">
                <img src="https://picsum.photos/300/400?random=24" alt="封面">
                <div class="anime-name">苍兰诀</div>
            </div>
            <div class="anime-card" onclick="location.href='episode.html?name=琅琊榜&total=54'">
                <img src="https://picsum.photos/300/400?random=25" alt="封面">
                <div class="anime-name">琅琊榜</div>
            </div>
            <div class="anime-card" onclick="location.href='episode.html?name=知否知否&total=78'">
                <img src="https://picsum.photos/300/400?random=26" alt="封面">
                <div class="anime-name">知否知否</div>
            </div>
            <div class="anime-card" onclick="location.href='episode.html?name=庆余年&total=46'">
                <img src="https://picsum.photos/300/400?random=27" alt="封面">
                <div class="anime-name">庆余年</div>
            </div>
            <div class="anime-card" onclick="location.href='episode.html?name=沉默的真相&total=12'">
                <img src="https://picsum.photos/300/400?random=28" alt="封面">
                <div class="anime-name">沉默的真相</div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function () {
            let urlParams = new URLSearchParams(window.location.search);
            let keyword = urlParams.get("q");
            if (keyword) {
                document.getElementById("searchInput").value = keyword;
                searchTV();
            }
        };

        function searchTV() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let cards = document.getElementsByClassName("anime-card");
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getElementsByClassName("anime-name")[0].innerText.toLowerCase();
                cards[i].style.display = name.includes(input) ? "block" : "none";
            }
        }
    </script>
</body>
</html>
