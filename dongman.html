<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫频道</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 40px;
            color: #ff6b9d;
            font-family: "幼圆", sans-serif;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .back-home {
            text-align: center;
            margin-bottom: 30px;
        }

        .back-btn {
            padding: 10px 25px;
            border-radius: 30px;
            background: #ff6b9d;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            .anime-card:hover {
                transform: translateY(-8px) scale(1.03);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
                border-color: rgba(255, 255, 255, 0.3);
            }

            .anime-card img {
                width: 100%;
                height: 280px;
                object-fit: cover;
            }

        .anime-name {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">

        </div>
