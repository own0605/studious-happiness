<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫导航页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 42px;
            margin-bottom: 20px;
            color: #ff6b9d;
            font-family: "幼圆", sans-serif;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        /* 搜索框样式 */
        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .search-input {
            width: 60%;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.15);
            color: #fff;
            backdrop-filter: blur(10px);
        }

            .search-input::placeholder {
                color: #ccc;
            }

        .search-btn {
            padding: 12px 25px;
            margin-left: 10px;
            border-radius: 30px;
            border: none;
            background: #ff6b9d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        /* 分类导航栏样式 */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .nav-item {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

            .nav-item:hover {
                background: #ff6b9d;
                transform: scale(1.08);
                box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
            }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            .anime-card:hover {
                transform: translateY(-8px) scale(1.03);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
                border-color: rgba(255, 255, 255, 0.3);
            }

            .anime-card img {
                width: 100%;
                height: 280px;
                object-fit: cover;
            }

        .anime-name {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="title">张雨筝的看片网站</h1>

        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="搜索动漫名称..." oninput="searchAnime()">
            <button class="search-btn" onclick="searchAnime()">搜索</button>
        </div>

        <!-- 新增分类导航栏 -->
        <div class="nav-tabs">
            <div class="nav-item" onclick="location.href='dongman.html'">动漫</div>
            <div class="nav-item" onclick="location.href='dianshiju.html'">电视剧</div>
            <div class="nav-item" onclick="location.href='dianying.html'">电影</div>
            <div class="nav-item" onclick="location.href='zongyi.html'">综艺</div>
        </div>

        <div class="anime-grid" id="animeGrid">
            <!-- 动漫1 -->
            <div class="anime-card" onclick="window.open('https://www.bilibili.com/', '_blank')">
                <img src="https://picsum.photos/300/400?random=1" alt="封面">
                <div class="anime-name">海贼王</div>
            </div>

            <!-- 动漫2 -->
            <div class="anime-card" onclick="window.open('https://www.acfun.cn/', '_blank')">
                <img src="https://picsum.photos/300/400?random=2" alt="封面">
                <div class="anime-name">鬼灭之刃</div>
            </div>

            <!-- 动漫3 -->
            <div class="anime-card" onclick="window.open('https://www.baidu.com/', '_blank')">
                <img src="https://picsum.photos/300/400?random=3" alt="封面">
                <div class="anime-name">咒术回战</div>
            </div>

            <!-- 动漫4 -->
            <div class="anime-card" onclick="window.open('https://www.qq.com/', '_blank')">
                <img src="https://picsum.photos/300/400?random=4" alt="封面">
                <div class="anime-name">进击的巨人</div>
            </div>
        </div>
    </div>

    <!-- 搜索功能JS -->
    <script>
        function searchAnime() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let cards = document.getElementsByClassName("anime-card");

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getElementsByClassName("anime-name")[0].innerText.toLowerCase();
                if (name.includes(input)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
