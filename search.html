<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: "Microsoft YaHei",sans-serif;
            background: linear-gradient(to right,#0f2027,#203a43,#2c5364);
            color: white;
            padding: 40px 20px;
            min-height: 100vh
        }

        .container {
            max-width: 1200px;
            margin: 0 auto
        }

        .title {
            text-align: center;
            font-size: 30px;
            margin-bottom: 30px;
            color: #ff6b9d
        }

        .back-btn {
            padding: 10px 25px;
            border-radius: 30px;
            background: #ff6b9d;
            color: #fff;
            border: none;
            cursor: pointer;
            display: block;
            margin: 0 auto 30px
        }

        .result-section {
            margin-bottom: 40px
        }

        .result-title {
            font-size: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #ff6b9d;
            padding-left: 10px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
            gap: 20px
        }

        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer
        }

            .card:hover {
                transform: translateY(-5px)
            }

            .card img {
                width: 100%;
                height: 240px;
                object-fit: cover
            }

            .card .name {
                padding: 10px;
                text-align: center;
                font-size: 16px
            }

        .empty {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #aaa
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">搜索结果</h1>
        <button class="back-btn" onclick="location.href='index.html'">← 返回首页</button>
        <div id="resultContainer"></div>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const keyword = (params.get("q") || "").toLowerCase();

        const pages = [
            { name: "📺 电视剧", url: "dianshiju.html" },
            { name: "🔥 动漫", url: "dongman.html" },
            { name: "🎬 电影", url: "dianying.html" },
            { name: "🎤 综艺", url: "zongyi.html" },
        ];

        let completed = 0;
        let hasAnyResult = false;

        pages.forEach(page => {
            fetch(page.url)
                .then(res => res.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");
                    const cards = doc.querySelectorAll(".anime-card");
                    const list = [];

                    cards.forEach(c => {
                        const name = c.querySelector(".anime-name")?.innerText || "";
                        const img = c.querySelector("img")?.src || "";
                        if (name.toLowerCase().includes(keyword)) {
                            list.push({ name, img, link: page.url });
                        }
                    });

                    if (list.length > 0) {
                        hasAnyResult = true;
                        const container = document.getElementById("resultContainer");
                        const section = document.createElement("div");
                        section.className = "result-section";

                        const title = document.createElement("h2");
                        title.className = "result-title";
                        title.innerText = page.name;
                        section.appendChild(title);

                        const grid = document.createElement("div");
                        grid.className = "grid";

                        list.forEach(item => {
                            const card = document.createElement("div");
                            card.className = "card";
                            card.innerHTML = `<img src="${item.img}"><div class="name">${item.name}</div>`;
                            card.onclick = () => location.href = item.link;
                            grid.appendChild(card);
                        });

                        section.appendChild(grid);
                        container.appendChild(section);
                    }

                    completed++;
                    if (completed === pages.length && !hasAnyResult) {
                        document.getElementById("resultContainer").innerHTML = `<div class="empty">未找到相关内容</div>`;
                    }
                });
        });
    </script>
</body>
</html>
